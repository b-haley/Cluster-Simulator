services:
  postgres:
    image: postgres:17
    container_name: clustersim-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clustersim}
      POSTGRES_USER: ${POSTGRES_USER:-clustersim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - clustersim_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clustersim} -d ${POSTGRES_DB:-clustersim}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clustersim_postgres_data:
